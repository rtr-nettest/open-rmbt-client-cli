name: Build RMBT Client CLI

on: [push]

permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Java: shaded JAR (platform-independent, built once)
  # ─────────────────────────────────────────────────────────────────────────────
  java-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build shaded JAR
        run: mvn -f clientJava/pom.xml package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: rmbt-client-jar
          path: clientJava/target/rmbt-client.jar
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # Rust: static musl for Linux; native/cross for macOS; Windows x64 = GNU +
  # static CRT (no MSVC redistributable), Windows arm64 = MSVC + static CRT
  # macos-latest is now Apple Silicon (arm64); x64 cross-compiles cleanly via Rust.
  # ─────────────────────────────────────────────────────────────────────────────
  rust:
    name: Rust / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: linux-arm64
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            use_cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            use_cross: false
          # Windows x64: GNU (MinGW) toolchain + static CRT, so the binary links
          # only against OS-provided DLLs (msvcrt.dll) and never the MSVC
          # redistributable — no VCRUNTIME140.dll dependency, nothing to ship.
          # Fixes STATUS_DLL_NOT_FOUND (0xC0000135) on machines without the
          # VC++ runtime.
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            name: windows-x64
            use_cross: false
            windows_gnu: true
            rustflags: "-C target-feature=+crt-static"
          # Windows arm64: no usable *-pc-windows-gnu Rust target exists, so keep
          # MSVC but statically link the CRT (+crt-static) — the runtime is baked
          # into the exe, so again there is no VCRUNTIME140.dll dependency and
          # nothing is shipped separately.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            use_cross: false
            rustflags: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ring (via rustls) compiles some C, so the x86_64-pc-windows-gnu build
      # needs a MinGW-w64 gcc on PATH. Use MSYS2's MINGW64 environment, which is
      # msvcrt-flavoured to match the gnu target. (The egor-tensin action is
      # unmaintained and fails on current UCRT-flavoured mingw packages.)
      - name: Set up MSYS2 / MinGW-w64 (Windows GNU target)
        if: matrix.windows_gnu == true
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Put MinGW-w64 on PATH (Windows GNU target)
        if: matrix.windows_gnu == true
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clientRust/target
          key: rust-${{ matrix.target }}-${{ hashFiles('clientRust/Cargo.lock', 'clientRust/Cargo.toml') }}
          restore-keys: rust-${{ matrix.target }}-

      - name: Install musl-tools (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Cache cross binary
        if: matrix.use_cross == true
        id: cache-cross
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cross
          key: cross-stable-v1

      - name: Install cross
        if: matrix.use_cross == true && steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo install cross

      - name: Build (native)
        if: matrix.use_cross == false
        env:
          # Empty for non-Windows targets; "+crt-static" for the Windows builds
          # so the runtime is linked in and no VC++ redistributable is required.
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }} --manifest-path clientRust/Cargo.toml

      - name: Build (cross — Docker-based)
        if: matrix.use_cross == true
        working-directory: clientRust
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp clientRust/target/${{ matrix.target }}/release/rmbt-client dist/
          cd dist && zip rmbt-client-rust-${{ matrix.name }}.zip rmbt-client

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "clientRust\target\${{ matrix.target }}\release\rmbt-client.exe" dist\
          Compress-Archive -Path dist\rmbt-client.exe -DestinationPath dist\rmbt-client-rust-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.name }}
          path: dist/rmbt-client-rust-${{ matrix.name }}.zip
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # C client — every variant in one job (per-matrix runs-on, like the rust job):
  #   • linux-x64 / linux-arm64  — dynamically linked (glibc, system libcurl+OpenSSL)
  #   • macos-arm64              — dynamically linked (Homebrew curl + openssl@3)
  # Windows is unsupported: the C client uses POSIX socket APIs (sys/socket.h,
  # netdb.h, …) with no Windows equivalent without major refactoring.
  # macOS x64 is not built separately: the arm64 binary runs on Intel via Rosetta.
  # ─────────────────────────────────────────────────────────────────────────────
  c:
    name: C / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            build: linux-native
          - name: linux-arm64
            os: ubuntu-latest
            build: linux-docker
            docker_platform: linux/arm64
          - name: macos-arm64
            os: macos-latest
            build: macos-native

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # QEMU lets the x64 runner execute arm64 containers.
      - uses: docker/setup-qemu-action@v3
        if: matrix.docker_platform == 'linux/arm64'

      # ── Linux x64 — native, dynamically linked ─────────────────────────────
      - name: Install deps (Linux native)
        if: matrix.build == 'linux-native'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Build (Linux native)
        if: matrix.build == 'linux-native'
        run: make -C clientC

      # ── Linux arm64 — dynamically linked, built in an Ubuntu container ─────
      - name: Build (Linux arm64 in Docker)
        if: matrix.build == 'linux-docker'
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            ubuntu:latest \
            bash -c "
              apt-get update -qq &&
              apt-get install -y git gcc make libcurl4-openssl-dev libssl-dev &&
              git config --global --add safe.directory /workspace &&
              make -C clientC
            "

      # ── macOS arm64 — native, dynamically linked (Homebrew) ────────────────
      - name: Install deps (macOS)
        if: matrix.build == 'macos-native'
        run: brew install curl openssl@3 pkg-config

      - name: Build (macOS)
        if: matrix.build == 'macos-native'
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig"
          make -C clientC

      # ── Package + upload (identical for every variant) ─────────────────────
      - name: Package
        run: |
          mkdir -p dist
          cp clientC/build/rmbt-client dist/
          cd dist && zip rmbt-client-c-${{ matrix.name }}.zip rmbt-client

      - uses: actions/upload-artifact@v4
        with:
          name: c-${{ matrix.name }}
          path: dist/rmbt-client-c-${{ matrix.name }}.zip
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # Java native images via jpackage — bundles a JRE per platform
  # ─────────────────────────────────────────────────────────────────────────────
  java-native:
    name: Java native / ${{ matrix.name }}
    needs: java-jar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
          - os: windows-11-arm
            name: windows-arm64
            # Temurin has no Windows/AArch64 build of JDK 25; Zulu does.
            distribution: zulu

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: ${{ matrix.distribution || 'temurin' }}

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: rmbt-client-jar
          path: jar-input

      - name: Compute app version
        id: ver
        shell: bash
        run: |
          INITIAL=$(git rev-list --max-parents=0 HEAD)
          echo "count=$(git rev-list --count ${INITIAL}..HEAD)" >> $GITHUB_OUTPUT

      - name: Create app image (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p jpackage-out
          jpackage \
            --input jar-input \
            --name rmbt-client \
            --main-jar rmbt-client.jar \
            --main-class at.rtr.rmbt.client.Main \
            --type app-image \
            --app-version "1.0.${{ steps.ver.outputs.count }}" \
            --vendor "RTR" \
            --dest jpackage-out

      - name: Create app image (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force jpackage-out
          jpackage `
            --input jar-input `
            --name rmbt-client `
            --main-jar rmbt-client.jar `
            --main-class at.rtr.rmbt.client.Main `
            --type app-image `
            --win-console `
            --app-version "1.0.${{ steps.ver.outputs.count }}" `
            --vendor RTR `
            --dest jpackage-out

      - name: Zip image (Linux)
        if: runner.os == 'Linux'
        run: cd jpackage-out && zip -r rmbt-client-java-${{ matrix.name }}.zip rmbt-client

      - name: Zip image (macOS — .app bundle)
        if: runner.os == 'macOS'
        run: cd jpackage-out && zip -r rmbt-client-java-${{ matrix.name }}.zip rmbt-client.app

      - name: Zip image (Windows)
        if: runner.os == 'Windows'
        run: |
          Set-Location jpackage-out
          Compress-Archive -Path rmbt-client -DestinationPath rmbt-client-java-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: java-${{ matrix.name }}
          path: jpackage-out/rmbt-client-java-${{ matrix.name }}.zip
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # Source archive
  # ─────────────────────────────────────────────────────────────────────────────
  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        run: git archive --format=zip --output=rmbt-client-cli-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: rmbt-client-cli-source.zip
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # GitHub Release — only on tag push
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [java-jar, rust, c, java-native, source-zip]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/rmbt-client-jar/*.jar
            release-assets/rust-linux-x64/*.zip
            release-assets/rust-linux-arm64/*.zip
            release-assets/rust-macos-arm64/*.zip
            release-assets/rust-macos-x64/*.zip
            release-assets/rust-windows-x64/*.zip
            release-assets/rust-windows-arm64/*.zip
            release-assets/c-linux-x64/*.zip
            release-assets/c-linux-arm64/*.zip
            release-assets/c-macos-arm64/*.zip
            release-assets/java-linux-x64/*.zip
            release-assets/java-linux-arm64/*.zip
            release-assets/java-macos-arm64/*.zip
            release-assets/java-windows-x64/*.zip
            release-assets/java-windows-arm64/*.zip
            release-assets/source/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
